name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libclang-dev cmake
      - run: npm ci
      - name: Download local transcription model
        shell: bash
        run: curl -fL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin -o src-tauri/resources/models/ggml-tiny.en.bin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Spoken Dev Brief ${{ github.ref_name }}
          releaseBody: Local-first desktop packages. These v1 packages are unsigned.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release download "${GITHUB_REF_NAME}" --dir release-assets
      - name: Create checksums and manifest
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name latest.json -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          python3 ../scripts/make-release-manifest.py "${GITHUB_REF_NAME}" "$GITHUB_REPOSITORY" > latest.json
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS latest.json --clobber
