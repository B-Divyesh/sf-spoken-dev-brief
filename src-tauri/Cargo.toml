[package]
name = "spoken-dev-brief"
version = "0.1.2"
description = "Local-first spoken engineering decision recorder"
authors = ["Param Factory"]
edition = "2021"
license = "MIT"

[lib]
name = "spoken_dev_brief_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
whisper-rs = "0.14.2"
hound = "3.5.1"
